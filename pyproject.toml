[project]
name = "oracle-parquet-pipeline"
version = "0.1.0"
description = "Bounded-memory Oracle to Apache Parquet pipeline with Streamlit UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oracledb>=2.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_parquet"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: mark test as an integration test requiring live database connectivity",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
